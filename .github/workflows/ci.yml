name: CI

# Keep CI minutes low: only Rust changes build, draft PRs are skipped (mark the PR
# ready to run it), and develop isn't built again after a merge because its PR
# already was. Merge the latest develop into a branch before marking it ready.
on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/ci.yml", "!**.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rustfmt.toml", ".github/workflows/ci.yml", "!**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Formatting
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.name }}
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
