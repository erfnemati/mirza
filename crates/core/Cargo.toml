[package]
name = "mirza-core"
description = "Mirza's settings, providers, audio capture and daemon protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "socks"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"
