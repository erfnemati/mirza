[package]
name = "mirza-core"
description = "Mirza's settings, providers, audio capture and daemon protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
futures-util = "0.3.34"
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "socks"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-socks = "0.5.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android records in the app (Kotlin) and passes the audio in.
[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Registry"] }
