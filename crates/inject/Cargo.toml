[package]
name = "mirza-inject"
description = "Types recognized text into the focused window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["rt"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
