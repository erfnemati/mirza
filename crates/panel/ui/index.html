<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="" width="26" height="26">
      <span class="brand-name">Mirza</span>
    </div>
    <div class="topbar-right">
      <span class="status" id="status"><span class="dot"></span><span id="status-text">…</span></span>
      <button class="btn btn-sm hidden" id="main-action"></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="nav" aria-label="Settings sections"></nav>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
